# GitHub Actions workflow to run Python unit tests on every push to main

name: Python unit tests

on:
	push:
		branches:
			- main

jobs:
	test:
		runs-on: ubuntu-latest
		steps:
			- name: Check out repository
				uses: actions/checkout@v4
			- name: Set up Python
				uses: actions/setup-python@v5
				with:
					python-version: '3.x'
			- name: Run unit tests
				run: python -m unittest discover -v
